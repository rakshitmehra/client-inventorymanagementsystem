# Builds the API container and deploys it to Cloudflare.
#
# This exists because Cloudflare Containers builds the image on whichever
# machine runs `wrangler deploy`, and that needs Docker. GitHub's runners have
# Docker preinstalled, so the build happens here instead of on your laptop.
#
# Nothing about the deployment is special to CI: this runs exactly the command
# you would run locally, in a place that already has the one tool you are
# missing.

name: Deploy API to Cloudflare

on:
  push:
    branches: [main]
    # Only rebuild when the API or this workflow actually changes. Frontend-only
    # commits go to Vercel and have no business rebuilding a Python image.
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  # Adds a "Run workflow" button on the Actions tab, for deploying without a
  # commit - after changing a secret, for example.
  workflow_dispatch:

# A second push while the first is still building would race it to the same
# Worker. Queue instead, and never cancel a deploy half-way.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the Cloudflare CLI
        working-directory: backend
        # Only wrangler and the container SDK. The API's own dependencies are
        # Python and get installed inside the image by pip.
        run: bun install --frozen-lockfile

      - name: Show the Docker version
        # Proves the runner has what your laptop does not, and makes a missing
        # daemon obvious here rather than fifty lines into a build log.
        run: docker --version

      - name: Deploy to Cloudflare
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Builds backend/Dockerfile, pushes it to Cloudflare's managed registry
        # and rolls the container out. The Worker's secrets (DATABASE_URL,
        # JWT_SECRET, CORS_ORIGINS) are set separately with `wrangler secret
        # put` and are NOT touched here - they live on Cloudflare, not in
        # GitHub, so there is only ever one copy of your database password.
        run: bunx wrangler deploy
